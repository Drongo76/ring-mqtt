name: Build and Push ring-mqtt HA image

on:
  push:
    branches: [ "main", "fix/distinct-snapshots", "feature/adaptive-ki-burst" ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        run: npm test

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: image
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" = "feature/adaptive-ki-burst" ]; then
            echo "tag=ghcr.io/drongo76/ring-mqtt-custom:build-20" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_NAME}" = "fix/distinct-snapshots" ]; then
            echo "tag=ghcr.io/drongo76/ring-mqtt-custom:build-14" >> "$GITHUB_OUTPUT"
          else
            echo "tag=ghcr.io/drongo76/ring-mqtt-custom:build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tag }}

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ steps.image.outputs.tag }}"
