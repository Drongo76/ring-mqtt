name: Build and Push ring-mqtt HA image

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit and integration tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            # Surface failing tests as an annotation: job logs are not always retrievable by API users.
            summary=$(grep -E "^\s*not ok|^\s*(error|expected|actual|message):|ERR_[A-Z_]+|Cannot find" test.log | head -60 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=Failing tests::${summary}"
          fi
          exit $status

  build:
    needs: test
    # Pull requests only run the tests; images are built from main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: image
        shell: bash
        run: |
          echo "tag=ghcr.io/drongo76/ring-mqtt-custom:main-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tag }}

      - name: Inspect image
        run: docker buildx imagetools inspect "${{ steps.image.outputs.tag }}"
