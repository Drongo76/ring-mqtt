name: Apply build-28 direct Snapshot root-cause fix

on:
  push:
    branches: [ "hotfix/build-28-direct-rootfix" ]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/build-28-direct-rootfix

      - name: Apply direct camera.js fix
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('devices/camera.js')
          s = p.read_text()

          old = "        const refreshGeneration = ++this.snapshotRefreshGeneration\n"
          new = "        const refreshGeneration = type === 'interval' ? null : ++this.snapshotRefreshGeneration\n"
          if s.count(old) != 1:
              raise SystemExit(f'expected generation assignment once, found {s.count(old)}')
          s = s.replace(old, new, 1)

          old = "            if (refreshGeneration !== this.snapshotRefreshGeneration) {\n"
          new = "            if (type !== 'interval' && refreshGeneration !== this.snapshotRefreshGeneration) {\n"
          if s.count(old) != 1:
              raise SystemExit(f'expected supersession guard once, found {s.count(old)}')
          s = s.replace(old, new, 1)

          p.write_text(s)
          PY

          rm .github/workflows/apply-build28-direct-rootfix.yml

      - name: Commit direct root-cause fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add devices/camera.js .github/workflows/apply-build28-direct-rootfix.yml
          git commit -m "build-28: restore pre-regression interval snapshot semantics"
          git push origin HEAD:hotfix/build-28-direct-rootfix
