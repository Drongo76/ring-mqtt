name: Candidate selector tests

on:
  push:
    branches: [ "candidate/build-28-early-f2-f3" ]

permissions:
  contents: write

jobs:
  normalize-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: candidate/build-28-early-f2-f3

      - name: Normalize temporary output guard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/build12-patch.js')
          text = path.read_text()
          pattern = r"(?:            assertKiBurstOutputFiles\(details\.paths\)\n)+            persistKiBurstFrames\(details\.paths, composed\.frames\)\n            assertKiBurstOutputFiles\(details\.paths\)"
          replacement = "            assertKiBurstOutputFiles(details.paths)\n            persistKiBurstFrames(details.paths, composed.frames)\n            assertKiBurstOutputFiles(details.paths)"
          text, count = re.subn(pattern, replacement, text, count=1)
          if count != 1:
              raise SystemExit('expected output guard block not found')
          path.write_text(text)
          PY

      - name: Commit normalization if needed
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/build12-patch.js
            git commit -m "candidate: normalize final output guard"
            git push origin HEAD:candidate/build-28-early-f2-f3
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm test
