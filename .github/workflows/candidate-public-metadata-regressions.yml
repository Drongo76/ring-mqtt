name: Candidate public metadata regressions

on:
  push:
    branches:
      - candidate/build-28-early-f2-f3

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: candidate/build-28-early-f2-f3

      - name: Apply metadata-only patch and regressions
        run: python .github/scripts/patch-public-metadata.py

      - name: Commit metadata-only changes if needed
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/build12-patch.js lib/build14-patch.js test/ki-burst-build25.test.js test/ki-burst-build27.test.js
            git commit -m "candidate: align public Burst metadata with final frames"
            git push origin HEAD:candidate/build-28-early-f2-f3
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm test
