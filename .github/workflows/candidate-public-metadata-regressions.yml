name: Candidate public metadata regressions

on:
  push:
    branches: [ "candidate/build-28-early-f2-f3" ]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: candidate/build-28-early-f2-f3

      - name: Fix only final public Burst metadata and regressions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old in text:
                  p.write_text(text.replace(old, new, 1))
                  return
              if new in text:
                  return
              raise SystemExit(f'expected block not found in {path}: {old[:160]!r}')

          replace_once(
              'lib/build12-patch.js',
              '''            const selectorFrameHashes = Array.isArray(details.frameHashes) ? [...details.frameHashes] : []
            const selectorSourceIndices = Array.isArray(details.frameSourceIndices) ? details.frameSourceIndices : []
            const snapshotCapturedAt = Number.isFinite(Number(snapshot.timestamp))
                ? new Date(Number(snapshot.timestamp) * 1000).toISOString()
                : null
            const snapshotSourceTimestamp = Number.isFinite(Number(snapshot.sourceTimestamp))
                ? Number(snapshot.sourceTimestamp)
                : null

            details = {
                ...details,
                frames: composed.frames,
                frameHashes: composed.frameHashes,
                selectorFrameHashes,
                outputFrameSources: ['motion_snapshot', 'adaptive_selected_2', 'adaptive_selected_3'],
                outputFrameSourceIndices: [null, selectorSourceIndices[0] ?? null, selectorSourceIndices[1] ?? null],
                snapshotCapturedAt,
                snapshotSourceTimestamp
            }''',
              '''            const selectorSourceIndices = Array.isArray(details.frameSourceIndices) ? details.frameSourceIndices : []
            const selectorSelectionReasons = Array.isArray(details.selectionReasons) ? details.selectionReasons : []
            const selectorFrameOffsetsMs = Array.isArray(details.frameOffsetsMs) ? details.frameOffsetsMs : []
            const selectorActualFrameOffsetsMs = Array.isArray(details.actualFrameOffsetsMs) ? details.actualFrameOffsetsMs : []
            const selectorDifferenceScores = Array.isArray(details.differenceScores) ? details.differenceScores : []
            const selectorChangedBlockRatios = Array.isArray(details.changedBlockRatios) ? details.changedBlockRatios : []
            const selectorFramePts = Array.isArray(details.framePts) ? details.framePts : []
            const selectorFramePtsTime = Array.isArray(details.framePtsTime) ? details.framePtsTime : []
            const selectorFrameTimestamps = Array.isArray(details.frameTimestamps) ? details.frameTimestamps : []
            const selectorFrameTypes = Array.isArray(details.frameTypes) ? details.frameTypes : []
            const selectorFrameRawChecksums = Array.isArray(details.frameRawChecksums) ? details.frameRawChecksums : []
            const selectorPairF2F3 = Array.isArray(details.pairwiseDifferenceScores)
                ? details.pairwiseDifferenceScores.find(entry => entry?.pair === 'F1-F2') || null
                : null
            const finalSelectorTriplet = (values, first = null) => [first, values[0] ?? null, values[1] ?? null]
            const snapshotCapturedAt = Number.isFinite(Number(snapshot.timestamp))
                ? new Date(Number(snapshot.timestamp) * 1000).toISOString()
                : null
            const snapshotSourceTimestamp = Number.isFinite(Number(snapshot.sourceTimestamp))
                ? Number(snapshot.sourceTimestamp)
                : null
            const finalFrameSourceIndices = finalSelectorTriplet(selectorSourceIndices)

            details = {
                ...details,
                frames: composed.frames,
                frameHashes: composed.frameHashes,
                frameOffsetsMs: finalSelectorTriplet(selectorFrameOffsetsMs),
                actualFrameOffsetsMs: finalSelectorTriplet(selectorActualFrameOffsetsMs),
                differenceScores: finalSelectorTriplet(selectorDifferenceScores),
                changedBlockRatios: finalSelectorTriplet(selectorChangedBlockRatios),
                pairwiseDifferenceScores: selectorPairF2F3 ? [{ ...selectorPairF2F3, pair: 'F2-F3' }] : [],
                totalDiversityScore: null,
                selectionReasons: ['motion_snapshot', selectorSelectionReasons[0] ?? null, selectorSelectionReasons[1] ?? null],
                frameSourceIndices: finalFrameSourceIndices,
                framePts: finalSelectorTriplet(selectorFramePts),
                framePtsTime: finalSelectorTriplet(selectorFramePtsTime),
                frameTimestamps: finalSelectorTriplet(selectorFrameTimestamps, snapshotCapturedAt),
                frameTypes: finalSelectorTriplet(selectorFrameTypes),
                frameRawChecksums: finalSelectorTriplet(selectorFrameRawChecksums),
                outputFrameSources: ['motion_snapshot', 'adaptive_selected_2', 'adaptive_selected_3'],
                outputFrameSourceIndices: finalFrameSourceIndices,
                snapshotCapturedAt,
                snapshotSourceTimestamp
            }'''
          )

          replace_once(
              'lib/build12-patch.js',
              "        selectorFrameHashes: Array.isArray(details.selectorFrameHashes) ? details.selectorFrameHashes : [],\n",
              ""
          )

          replace_once(
              'lib/build14-patch.js',
              '''    return {
        ...currentAttributes,
        ...extractBuild14PublicDiagnostics(diagnostics),
        rtpIntegrity: compactRtpIntegrityForHomeAssistant(currentAttributes.rtpIntegrity)
    }''',
              '''    // publishBurstState() owns the canonical public F1/F2/F3 metadata.
    // Build-14 selector diagnostics describe the internal WebRTC triplet and must
    // remain internal instead of overwriting the final published-frame metadata.
    return {
        ...currentAttributes,
        rtpIntegrity: compactRtpIntegrityForHomeAssistant(currentAttributes.rtpIntegrity)
    }'''
          )

          replace_once(
              'test/ki-burst-build25.test.js',
              '''        frameSourceIndices: [0, 54, 68],
        frameHashes: [Buffer.from('HASH_A'), Buffer.from('HASH_B'), Buffer.from('HASH_C')].map(kiBurstFrameHash),
        candidateEvaluations: [
            { index: 0, reason: 'first_clean_frame', selectedImmediately: true },
            { index: 54, reason: 'buffered_visual_change', selectedImmediately: false },
            { index: 68, reason: 'buffered_candidate', selectedImmediately: false }
        ],
        selectionReasons: ['first_clean_frame', 'early_visual_change_primary', 'compatibility_tail'],
        selectionMode: 'adaptive_buffered',
        observationWindowMs: 6000,
        minimumSelectionSeparationMs: 1000''',
              '''        frameSourceIndices: [0, 54, 68],
        frameOffsetsMs: [0, 1250, 2500],
        actualFrameOffsetsMs: [0, 1250, 2500],
        differenceScores: [0, 0.1, 0.2],
        changedBlockRatios: [0, 0.12, 0.22],
        pairwiseDifferenceScores: [
            { pair: 'F1-F2', score: 0.22, differenceScore: 0.1, changedBlockRatio: 0.12 },
            { pair: 'F2-F3', score: 0.35, differenceScore: 0.15, changedBlockRatio: 0.2 },
            { pair: 'F1-F3', score: 0.41, differenceScore: 0.19, changedBlockRatio: 0.22 }
        ],
        totalDiversityScore: 0.98,
        framePts: [100, 200, 300],
        framePtsTime: [0, 1.25, 2.5],
        frameTimestamps: [
            '2026-09-11T10:00:04.300Z',
            '2026-09-11T10:00:05.550Z',
            '2026-09-11T10:00:06.800Z'
        ],
        frameTypes: ['I', 'P', 'P'],
        frameRawChecksums: ['RAW_A', 'RAW_B', 'RAW_C'],
        frameHashes: [Buffer.from('HASH_A'), Buffer.from('HASH_B'), Buffer.from('HASH_C')].map(kiBurstFrameHash),
        candidateEvaluations: Array.from({ length: 256 }, (_, index) => ({
            index,
            reason: index === 0 ? 'first_clean_frame' : 'buffered_candidate',
            selectedImmediately: index === 0,
            diagnosticPadding: 'x'.repeat(128)
        })),
        selectionReasons: ['first_clean_frame', 'early_low_diversity_fallback', 'compatibility_tail'],
        selectionMode: 'adaptive_buffered',
        observationWindowMs: 6000,
        minimumSelectionSeparationMs: 1000'''
          )

          replace_once(
              'test/ki-burst-build25.test.js',
              '''        assert.deepEqual(attrs.frameSourceIndices, [0, 54, 68], 'selector diagnostics remain available internally')
        assert.deepEqual(attrs.outputFrameSourceIndices, [null, 0, 54])
        assert.deepEqual(attrs.outputFrameSources, ['motion_snapshot', 'adaptive_selected_2', 'adaptive_selected_3'])
        assert.equal(attrs.frameHashes[1], attrs.selectorFrameHashes[0], 'published Frame2 hash must map to selector selected[0]')
        assert.equal(attrs.frameHashes[2], attrs.selectorFrameHashes[1], 'published Frame3 hash must map to selector selected[1]')
        assert.equal(attrs.frameHashes[1], kiBurstFrameHash(finalFrame2), 'published Frame2 hash must match final frame-2 JPEG bytes')
        assert.equal(attrs.frameHashes[2], kiBurstFrameHash(finalFrame3), 'published Frame3 hash must match final frame-3 JPEG bytes')
        assert.equal(Object.hasOwn(attrs, 'candidateEvaluations'), false, 'candidateEvaluations must remain internal and must not publish stale final-frame naming')
        assert.deepEqual(attrs.selectionReasons, ['first_clean_frame', 'early_visual_change_primary', 'compatibility_tail'])
        assert.equal(attrs.selectionReasons.some(reason => /^adaptive_selected_[12]$/.test(reason)), false, 'published selection metadata must not call old selector positions final F2/F3')
        assert.equal(attrs.frameHashes[0] === attrs.selectorFrameHashes[0], false, 'published Frame1 hash must describe the Motion Snapshot, not selector selected[0]')''',
              '''        assert.deepEqual(attrs.frameSourceIndices, [null, 0, 54], 'public frameSourceIndices must describe final Snapshot/selected[0]/selected[1]')
        assert.deepEqual(attrs.outputFrameSourceIndices, [null, 0, 54])
        assert.deepEqual(attrs.outputFrameSources, ['motion_snapshot', 'adaptive_selected_2', 'adaptive_selected_3'])
        assert.deepEqual(attrs.selectionReasons, ['motion_snapshot', 'first_clean_frame', 'early_low_diversity_fallback'])
        assert.equal(attrs.selectionReasons.length, 3)
        assert.equal(attrs.selectionReasons.includes('compatibility_tail'), false)
        assert.equal(JSON.stringify(attrs).includes('compatibility_tail'), false, 'compatibility tail must not leak anywhere into public MQTT metadata')
        assert.deepEqual(attrs.frameOffsetsMs, [null, 0, 1250])
        assert.deepEqual(attrs.actualFrameOffsetsMs, [null, 0, 1250])
        assert.deepEqual(attrs.differenceScores, [null, 0, 0.1])
        assert.deepEqual(attrs.changedBlockRatios, [null, 0, 0.12])
        assert.deepEqual(attrs.pairwiseDifferenceScores, [
            { pair: 'F2-F3', score: 0.22, differenceScore: 0.1, changedBlockRatio: 0.12 }
        ])
        assert.equal(attrs.totalDiversityScore, null, 'selector-wide diversity includes compatibility_tail and must not masquerade as final-triple diversity')
        assert.deepEqual(attrs.framePts, [null, 100, 200])
        assert.deepEqual(attrs.framePtsTime, [null, 0, 1.25])
        assert.deepEqual(attrs.frameTypes, [null, 'I', 'P'])
        assert.deepEqual(attrs.frameRawChecksums, [null, 'RAW_A', 'RAW_B'])
        assert.equal(attrs.frameTimestamps[0], '1970-01-01T00:01:40.000Z')
        assert.deepEqual(attrs.frameTimestamps.slice(1), ['2026-09-11T10:00:04.300Z', '2026-09-11T10:00:05.550Z'])
        assert.equal(attrs.frameHashes[1], kiBurstFrameHash(Buffer.from('HASH_A')), 'published Frame2 hash must map to selector selected[0]')
        assert.equal(attrs.frameHashes[2], kiBurstFrameHash(Buffer.from('HASH_B')), 'published Frame3 hash must map to selector selected[1]')
        assert.equal(attrs.frameHashes[1], kiBurstFrameHash(finalFrame2), 'published Frame2 hash must match final frame-2 JPEG bytes')
        assert.equal(attrs.frameHashes[2], kiBurstFrameHash(finalFrame3), 'published Frame3 hash must match final frame-3 JPEG bytes')
        assert.equal(Object.hasOwn(attrs, 'selectorFrameHashes'), false, 'internal selector hashes must not be exposed as final-frame metadata')
        assert.equal(Object.hasOwn(attrs, 'candidateEvaluations'), false, 'candidateEvaluations must remain internal/debug only')
        assert.ok(Buffer.byteLength(JSON.stringify(attrs), 'utf8') < 8192, 'public metadata must stay compact for Recorder')'''
          )

          replace_once(
              'test/ki-burst-build27.test.js',
              "        selectionReasons: ['first_clean_frame', 'global_diversity', 'global_diversity'],",
              "        selectionReasons: ['first_clean_frame', 'early_visual_change_fallback', 'compatibility_tail'],"
          )

          replace_once(
              'test/ki-burst-build27.test.js',
              '''        assert.deepEqual(firstPublish.outputFrameSourceIndices, [null, 0, 54], 'final published source indices must map Snapshot, selected[0], selected[1]')
        assert.deepEqual(firstPublish.outputFrameSources, ['motion_snapshot', 'adaptive_selected_2', 'adaptive_selected_3'])
        assertNoHeavyRtpArrays(firstPublish, 'first publish')''',
              '''        assert.deepEqual(firstPublish.outputFrameSourceIndices, [null, 0, 54], 'final published source indices must map Snapshot, selected[0], selected[1]')
        assert.deepEqual(firstPublish.frameSourceIndices, [null, 0, 54], 'generic public source indices must also describe final frames')
        assert.deepEqual(firstPublish.outputFrameSources, ['motion_snapshot', 'adaptive_selected_2', 'adaptive_selected_3'])
        assert.deepEqual(firstPublish.selectionReasons, ['motion_snapshot', 'first_clean_frame', 'early_visual_change_fallback'])
        assert.equal(firstPublish.selectionReasons.includes('compatibility_tail'), false)
        assert.equal(Object.hasOwn(firstPublish, 'candidateEvaluations'), false)
        assert.equal(Object.hasOwn(firstPublish, 'selectorFrameHashes'), false)
        assert.equal(Object.hasOwn(firstPublish, 'targetFrameOffsetsMs'), false, 'legacy build14 target offsets must not enter canonical public metadata')
        assertNoHeavyRtpArrays(firstPublish, 'first publish')'''
          )

          replace_once(
              'test/ki-burst-build27.test.js',
              '''            assert.deepEqual(attrs.outputFrameSources, canonical.outputFrameSources)
            assert.deepEqual(attrs.outputFrameSourceIndices, canonical.outputFrameSourceIndices)
            assert.equal(attrs.snapshotCapturedAt, canonical.snapshotCapturedAt)
            assert.equal(attrs.snapshotSourceTimestamp, canonical.snapshotSourceTimestamp)''',
              '''            assert.deepEqual(attrs.outputFrameSources, canonical.outputFrameSources)
            assert.deepEqual(attrs.outputFrameSourceIndices, canonical.outputFrameSourceIndices)
            assert.deepEqual(attrs.frameSourceIndices, [null, 0, 54], `publish ${index + 1}: internal compatibility source index leaked`)
            assert.deepEqual(attrs.selectionReasons, ['motion_snapshot', 'first_clean_frame', 'early_visual_change_fallback'])
            assert.equal(attrs.selectionReasons.length, 3)
            assert.equal(attrs.selectionReasons.includes('compatibility_tail'), false)
            assert.equal(JSON.stringify(attrs).includes('compatibility_tail'), false, `publish ${index + 1}: compatibility tail leaked into public metadata`)
            assert.deepEqual(attrs.actualFrameOffsetsMs, [null, 0, 3150], `publish ${index + 1}: internal tail offset leaked`)
            assert.deepEqual(attrs.framePts, [null, 0, 283500], `publish ${index + 1}: internal tail PTS leaked`)
            assert.deepEqual(attrs.framePtsTime, [null, 0, 3.15], `publish ${index + 1}: internal tail pts_time leaked`)
            assert.deepEqual(attrs.frameTypes, [null, 'I', 'P'], `publish ${index + 1}: internal tail frame type leaked`)
            assert.deepEqual(attrs.frameRawChecksums, [null, 'RAW_A', 'RAW_B'], `publish ${index + 1}: internal tail checksum leaked`)
            assert.equal(Object.hasOwn(attrs, 'candidateEvaluations'), false)
            assert.equal(Object.hasOwn(attrs, 'selectorFrameHashes'), false)
            assert.equal(Object.hasOwn(attrs, 'targetFrameOffsetsMs'), false)
            assert.equal(attrs.snapshotCapturedAt, canonical.snapshotCapturedAt)
            assert.equal(attrs.snapshotSourceTimestamp, canonical.snapshotSourceTimestamp)'''
          )
          PY

      - name: Commit metadata-only runtime and regression changes if needed
        shell: bash
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add lib/build12-patch.js lib/build14-patch.js test/ki-burst-build25.test.js test/ki-burst-build27.test.js
            git commit -m "candidate: align public Burst metadata with final frames"
            git push origin HEAD:candidate/build-28-early-f2-f3
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run full test suite
        run: npm test
